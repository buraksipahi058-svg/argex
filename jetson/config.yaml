# ============================================================================
#  Jetson telemetry/video gateway configuration
#  This is the VEHICLE-SIDE observer. It reads the FROZEN STM32<->Jetson STATUS/
#  HEARTBEAT stream and forwards a structured, read-only telemetry view to the
#  Base Station. It never originates COMMAND and never disables the existing
#  Jetson->STM heartbeat/autonomy traffic.
# ============================================================================

source:
  # How the gateway OBSERVES the STM protocol bytes:
  #   serial : read-only open of a UART carrying the STM STATUS/HEARTBEAT stream
  #            (real vehicle). Does not write; does not own the control link.
  #   udp    : receive raw STM protocol bytes over UDP (used by sim/fake_stm and
  #            for an on-Jetson IPC tap where the existing process re-publishes
  #            the raw frames it already reads).
  type: serial

  # --- serial source (real hardware) ---
  # ESP32 (ika_esp32) kontrolcu, Jetson linki 3.3V USB-TTL uzerinden:
  #   USB-TTL TX -> ESP32 GPIO21 (RX),  USB-TTL RX <- ESP32 GPIO22 (TX),  GND ortak.
  # Jetson'da bu bir USB seri cihazidir: /dev/ttyUSB0 (numarasi replug'da kayar,
  # sabitlemek icin by-id yolunu kullanin, ornek:
  #   /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A50285BI-if00-port0).
  # ESP32'nin KENDI USB portu ayri bir cihazdir ve sadece flash/debug icindir;
  # protokol oradan AKMAZ.
  # (Eski yollar: STM32F407 native USB-CDC; 40-pin UART /dev/ttyTHS1.)
  serial_port: /dev/ttyUSB0
  serial_baud: 115200          # controller.cpp JETSON_BAUD ile ayni olmali

  # !!! PORT SAHIPLIGI: bu portu ayni anda ikinci bir process acamaz. Otonom
  # koprusu (Jetson->ESP32 COMMAND yazan process) de ayni hatta oturur. Ikisi
  # birden calisacaksa gateway'i `type: udp` yapin ve koprunun okudugu ham
  # cerceveleri 127.0.0.1:9000'e re-publish ettirin (IPC tap).

  # --- udp source (sim / IPC tap) ---
  udp_host: 127.0.0.1
  udp_port: 9000

quic:
  host: 127.0.0.1              # Base Station backend address
  port: 4433
  use_datagrams_for_frames: true   # high-rate frames as QUIC datagrams (latest-wins)
  verify: false                    # DEV: accept self-signed backend cert

telemetry:
  frame_rate_hz: 20.0         # high-frequency plane; <= STATUS rate (20 Hz)
  gateway_heartbeat_hz: 1.0   # telemetry-plane liveness to the Base Station
  status_stale_ms: 300        # no STATUS for this long -> STM telemetry stale
  heartbeat_stale_ms: 600     # no HEARTBEAT for this long -> STM heartbeat stale
  event_debounce_ms: 150      # min interval between repeats of the same event type

video:
  # Gateway, kameralari MOD-FARKINDA yonetir (ffmpeg -> MediaMTX RTSP push):
  #   DRIVE modu  -> front + rear yayinda, turret kapali
  #   LASER modu  -> turret yayinda, front + rear kapali
  #   AUTO  modu  -> turret + front (nisan gorusu + gidis yonu), rear kapali
  # Mod, kontrolcunun aktifMod telemetrisinden gelir: CH5 DRIVE/LASER secer,
  # CH8 ikisini de ezip AUTO yapar. Gecis otomatiktir.
  # Ayni anda en fazla 2 kamera acik kalir: hem Wi-Fi bandini hem de USB
  # isochronous butcesini (3 es-zamanli -> VIDIOC_STREAMON ENOSPC) korur.
  enabled: true
  base_host: 127.0.0.1        # MediaMTX Jetson'da calisir (RTSP push hedefi)
  encoder: x264               # yazilim x264 (NVENC/rtspclientsink bu unitede yok)
  # Cihazlar SABIT yollarla baglanir (videoN numaralari reboot/replug'da kayar):
  #   - turret = C922 Pro : benzersiz seri -> by-id (hangi porta takilsa da bulunur)
  #   - front/rear = iki C270 : AYNI serili (200901010001) -> by-id ayirt EDEMEZ,
  #     bu yuzden by-path (fiziksel USB port) sart.
  # SART: her kamerayi hep ayni USB portunda tut (C922->2.1, front C270->2.2,
  # rear C270->2.4). Portu degistirirsen by-path eslemesi de degisir.
  cameras:
    # TARET: en iyi kamera (C922 Pro). Lazer modunda tek basina yayinlandigi icin
    # istenirse 720p'ye cikarilabilir (front/rear'i etkilemez).
    - name: turret
      device: /dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_6231597F-video-index0
      input_format: mjpeg
      width: 640
      height: 480
      fps: 30
      bitrate_kbps: 1000
      modes: [laser, auto]
    # ON: C270, USB port 2.2
    - name: front
      device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.2:1.0-video-index0
      input_format: mjpeg
      width: 640
      height: 480
      fps: 30
      bitrate_kbps: 1000
      modes: [drive, auto]
    # ARKA: C270, USB port 2.4
    - name: rear
      device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.4:1.0-video-index0
      input_format: mjpeg
      width: 640
      height: 480
      fps: 30
      bitrate_kbps: 1000
      modes: [drive]
